services:
  - type: web
    name: cuet-bus-ticket-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5001
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
