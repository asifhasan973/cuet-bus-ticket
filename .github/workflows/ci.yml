name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies & run tests
        run: |
          cd server
          npm install
          npm test
        env:
          NODE_ENV: test
          JWT_SECRET: testing_jwt_secret_must_be_long_and_secure

      - name: Install frontend dependencies & build
        run: |
          cd client
          npm install
          npm run build
