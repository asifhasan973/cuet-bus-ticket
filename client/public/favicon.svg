<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Purple -->
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" />

  <!-- Bus Symbol Group -->
  <g transform="translate(96, 80)">
    <!-- Bus Body Base Shadow -->
    <rect x="8" y="300" width="304" height="24" rx="12" fill="#0f172a" opacity="0.4" />

    <!-- Main Bus Body -->
    <path d="M24,40 C24,18 42,0 64,0 L256,0 C278,0 296,18 296,40 L296,280 C296,290 288,298 278,298 L42,298 C32,298 24,290 24,280 Z" fill="#ffffff" />
    
    <!-- Lower Panel Color Accent -->
    <path d="M24,160 L296,160 L296,280 C296,290 288,298 278,298 L42,298 C32,298 24,290 24,280 Z" fill="#f1f5f9" />
    <path d="M24,160 L296,160 L296,190 L24,190 Z" fill="#3b82f6" />

    <!-- Windshield / Glass -->
    <path d="M36,40 C36,28 46,18 58,18 L262,18 C274,18 284,28 284,40 L284,130 C284,134 280,138 276,138 L44,138 C40,138 36,134 36,130 Z" fill="url(#glassGrad)" />
    
    <!-- Windshield Divider -->
    <rect x="156" y="18" width="8" height="120" fill="#ffffff" opacity="0.3" />

    <!-- Headlights -->
    <circle cx="70" cy="236" r="22" fill="#e2e8f0" />
    <circle cx="70" cy="236" r="16" fill="#fef08a" filter="url(#glow)" />
    
    <circle cx="250" cy="236" r="22" fill="#e2e8f0" />
    <circle cx="250" cy="236" r="16" fill="#fef08a" filter="url(#glow)" />

    <!-- Grille -->
    <rect x="116" y="224" width="88" height="24" rx="12" fill="#cbd5e1" />
    <rect x="126" y="232" width="68" height="8" rx="4" fill="#64748b" />

    <!-- Front Bumper -->
    <rect x="12" y="274" width="296" height="24" rx="12" fill="#1e293b" />

    <!-- Wheels / Tires (visible underneath slightly) -->
    <rect x="36" y="294" width="48" height="20" rx="6" fill="#0f172a" />
    <rect x="236" y="294" width="48" height="20" rx="6" fill="#0f172a" />

    <!-- Mirrors -->
    <path d="M24,90 L2,90 C0.9,90 0,89.1 0,88 L0,50 C0,48.9 0.9,48 2,48 L24,64" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-8" y="44" width="12" height="40" rx="6" fill="#1e293b" />

    <path d="M296,90 L318,90 C319.1,90 320,89.1 320,88 L320,50 C320,48.9 319.1,48 318,48 L296,64" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="316" y="44" width="12" height="40" rx="6" fill="#1e293b" />
  </g>
</svg>